{{- if and .Values.ingressRoute.enabled .Values.ingressRoute.createTlsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingressRoute.tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-sync.labels" . | nindent 4 }}
  annotations:
    replicator.v1.mittwald.de/replicate-from: {{ .Values.ingressRoute.replicateFrom | quote }}
type: kubernetes.io/tls
data:
  tls.crt: ''
  tls.key: ''
{{- end }}
