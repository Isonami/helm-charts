apiVersion: v1
kind: Service
metadata:
  name: {{ include "remote-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-sync.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: web
    port: {{ .Values.service.port }}
    targetPort: web
  selector:
    {{- include "remote-sync.selectorLabels" . | nindent 4 }}
