{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "remote-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-sync.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
  - kind: Rule
    match: {{ .Values.ingressRoute.match | quote }}
    priority: {{ .Values.ingressRoute.priority }}
    services:
    - kind: Service
      name: {{ include "remote-sync.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: web
  tls:
    secretName: {{ .Values.ingressRoute.tlsSecretName }}
{{- end }}
