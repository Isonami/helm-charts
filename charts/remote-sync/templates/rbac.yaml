{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "remote-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-sync.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "remote-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "remote-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "remote-sync.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "remote-sync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
