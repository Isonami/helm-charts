# Default values for matterjs-server.

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

image:
  repository: ghcr.io/matter-js/matterjs-server
  # Defaults to Chart.appVersion when empty.
  tag: ""
  # When set, digest takes precedence over tag (for example, sha256:...).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Matter and mDNS generally require direct access to the host network. This is
# opt-in because it broadens network exposure and reserves port 5580 on a node.
hostNetwork: false
# Empty selects ClusterFirstWithHostNet when hostNetwork=true, otherwise ClusterFirst.
dnsPolicy: ""
hostAliases: []

service:
  enabled: true
  type: ClusterIP
  port: 5580
  nodePort: null
  clusterIP: ""
  annotations: {}

persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
  selector: {}
  # Used only when enabled=false. Empty means an unbounded emptyDir.
  emptyDir:
    sizeLimit: ""
  mountPath: /data

# Environment variables understood by Matter.js Server. Null entries are not
# emitted, while false and 0 are emitted. Add arbitrary MATTER_* variables here.
# PORT and STORAGE_PATH are reserved and derived from service.port and
# persistence.mountPath. BLE variables are generated by bluetooth settings.
config:
  LOG_LEVEL: info
  LISTEN_ADDRESS: null
  LOG_FILE: null
  PRIMARY_INTERFACE: null
  ENABLE_TEST_NET_DCL: null
  DISABLE_DCL_SEED: null
  BLE_PROXY: null
  DISABLE_OTA: null
  OTA_PROVIDER_DIR: null
  OTA_UPLOAD_MAX_IN_FLIGHT: null
  OTA_UPLOAD_MAX_SIZE_MB: null
  DISABLE_DASHBOARD: null
  PRODUCTION_MODE: null
  VENDOR_ID: null
  FABRIC_ID: null
  DEFAULT_FABRIC_LABEL: null
  DISABLE_THREAD_DIAGNOSTICS: null
  ENABLE_TIME_SYNC: null
  TZ: null
  NODE_OPTIONS: null

# Structured environment entries, including secretKeyRef/configMapKeyRef.
# Do not duplicate PORT, STORAGE_PATH, NOBLE_BINDINGS, or BLUETOOTH_ADAPTER.
extraEnv: []
envFrom: []
# Arguments are appended after the image entrypoint and override environment
# variables where the Matter.js CLI defines the same setting.
args: []

bluetooth:
  # Enables the recommended unprivileged D-Bus/BlueZ backend.
  enabled: false
  adapter: 0
  hostPath: /run/dbus

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    # Required by the image's ping functionality.
    add:
      - NET_RAW

probes:
  startup:
    enabled: true
    exec:
      command:
        - /usr/local/bin/healthcheck.sh
    periodSeconds: 5
    timeoutSeconds: 10
    failureThreshold: 180
  readiness:
    enabled: true
    exec:
      command:
        - /usr/local/bin/healthcheck.sh
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  liveness:
    enabled: true
    exec:
      command:
        - /usr/local/bin/healthcheck.sh
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 6

resources: {}

# Additional pod customization.
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
