# Default values for OpenThread Border Router.

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

image:
  repository: openthread/border-router
  # Defaults to Chart.appVersion (latest) when empty.
  tag: ""
  # When set, digest takes precedence over tag (for example, sha256:...).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# OTBR requires direct access to the node's interfaces for routing, multicast,
# mDNS, and TREL. Disabling this is supported but is not a typical deployment.
hostNetwork: true
# Empty selects ClusterFirstWithHostNet with host networking, else ClusterFirst.
dnsPolicy: ""
hostAliases: []

config:
  # Node interface connected to the adjacent Ethernet/Wi-Fi network.
  infraInterface: eth0
  threadInterface: wpan0
  logLevel: 7
  vendorName: OpenThread
  vendorModel: BorderRouter
  rcp:
    # An explicit Spinel URL overrides generated device/baudrate settings.
    # This also supports network-attached RCPs when device.enabled=false.
    url: ""
    baudrate: 1000000
    device:
      enabled: true
      hostPath: /dev/ttyACM0
      containerPath: /dev/ttyACM0
    akriDiscovery:
      enabled: false
      mountPath: /opt/otbr
  tunDevice:
    enabled: true
    hostPath: /dev/net/tun
    containerPath: /dev/net/tun

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  clusterIP: ""
  web:
    port: 8080
    nodePort: null
  rest:
    port: 8081
    nodePort: null

persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
  selector: {}
  # Used only when enabled=false. Empty means an unbounded emptyDir.
  emptyDir:
    sizeLimit: ""
  mountPath: /data

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
# Pod-level security settings. Kubernetes rejects net.* sysctls on pods using
# hostNetwork, so the OTBR routing sysctls remain documented but disabled while
# hostNetwork defaults to true. To use them, set hostNetwork=false and uncomment:
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # sysctls:
  #   - name: net/ipv6/conf/net1/accept_ra
  #     value: "2"
  #   - name: net/ipv6/conf/net1/accept_ra_rt_info_max_plen
  #     value: "64"
  #   - name: net/ipv6/conf/all/forwarding
  #     value: "1"
  #   - name: net/ipv4/ip_forward
  #     value: "1"

# OTBR runs as root and requires NET_ADMIN to create interfaces and firewall
# rules. Some runtimes also require privileged=true for host device access.
containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    drop:
      - ALL
    add:
      - NET_ADMIN
      - NET_RAW

probes:
  startup:
    enabled: true
    httpGet:
      path: /.well-known/thread/br-rest
      port: rest
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    enabled: true
    httpGet:
      path: /.well-known/thread/br-rest
      port: rest
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    httpGet:
      path: /.well-known/thread/br-rest
      port: rest
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 6

# Structured environment entries and complete Secret/ConfigMap imports.
# Chart-managed OT_* variables may not be duplicated in extraEnv.
extraEnv: []
envFrom: []
resources: {}

# Load OTBR firewall dependencies into the node kernel before starting OTBR.
# This init container is privileged and mounts the node's /lib/modules read-only.
kernelModules:
  enabled: true
  image:
    repository: alpine
    tag: "3.21"
    pullPolicy: IfNotPresent
  hostPath: /lib/modules
  modules:
    - ip_set
    - xt_set
    - xt_pkttype
    - nf_tables
    - nft_compat

# Additional init containers, rendered directly into the pod spec after the
# kernel-module loader.
extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30

test:
  image:
    repository: curlimages/curl
    tag: 8.12.1
    pullPolicy: IfNotPresent
