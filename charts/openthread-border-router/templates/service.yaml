{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openthread-border-router.fullname" . }}
  labels:
    {{- include "openthread-border-router.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  ports:
    - name: web
      port: {{ .Values.service.web.port }}
      targetPort: web
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.web.nodePort }}
      nodePort: {{ .Values.service.web.nodePort }}
      {{- end }}
    - name: rest
      port: {{ .Values.service.rest.port }}
      targetPort: rest
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.rest.nodePort }}
      nodePort: {{ .Values.service.rest.nodePort }}
      {{- end }}
  selector:
    {{- include "openthread-border-router.selectorLabels" . | nindent 4 }}
{{- end }}
